<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Trivia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <div id="question-counter" class="counter">1/10</div>
        <div class="logo-container">
            <img src="images/logo.svg" alt="Logo Trivia" class="logo">
        </div>
        <button class="btn btn-play">PLAY</button>
        <div class="attribution-box">
            <img src="images/opentrivia-logo.png" alt="Open Trivia DB Logo" class="otdb-logo">
            <p>Questions randomly selected from <a href="https://opentdb.com/" target="_blank">Open Trivia Database</a></p>
        </div>
        <div id="quiz-container" style="display: none;">
            <div id="loading-spinner" class="spinner"></div>
            <div id="quiz-content">
                <div id="category"></div>
                <div id="question"></div>
                <div id="answers"></div>
            </div>
        </div>
        <div id="end-screen" style="display: none;">
            <h1>YOUR SCORE</h1>
            <div class="final-score"></div>
            <button class="btn btn-play">REPLAY</button>
            <button class="btn btn-back">BACK</button>
        </div>
    </div>
    
    <script src="scripts/quiz.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
