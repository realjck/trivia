<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Test your knowledge with our fun trivia quiz game featuring random questions from various categories">
    <title>Quiz Trivia</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a237e">
    <link rel="apple-touch-icon" href="images/icon-192x192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <div id="difficulty-indicator" class="difficulty-indicator">
            <img src="" alt="Difficulty Level" class="difficulty-icon">
        </div>
        <div id="question-counter" class="counter">1/10</div>
        <div class="logo-container">
            <img src="images/logo.svg" alt="Logo Trivia" class="logo">
        </div>
        <button class="btn btn-play">PLAY</button>
        <div class="attribution-box">
            <img src="images/opentrivia-logo.png" alt="Open Trivia DB Logo" class="otdb-logo">
            <p>Questions randomly selected from <a href="https://opentdb.com/" target="_blank">Open Trivia Database</a></p>
        </div>
        <div id="quiz-container" style="display: none;">
            <div id="loading-spinner" class="spinner"></div>
            <div id="quiz-content">
                <div id="category"></div>
                <div id="question"></div>
                <div id="answers"></div>
            </div>
        </div>
        <div id="end-screen" style="display: none;">
            <h1>YOUR SCORE</h1>
            <div class="final-score"></div>
            <button class="btn btn-play">REPLAY</button>
            <button class="btn btn-back">BACK</button>
        </div>
    </div>
    
    <script src="scripts/quiz.js"></script>
    <script src="scripts/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
